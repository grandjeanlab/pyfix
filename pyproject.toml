[build-system]
requires      = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name            = "pyfix"
dynamic         = ["version"]
description     = "Python implementation of FSL's FIX tool for denoising"
readme          = {file = "README.md", content-type="text/markdown"}
license         = {text = "Apache License Version 2.0"}
requires-python = ">=3.8"
authors         = [{name = "Sean Fitzgibbon", email = "sean.fitzgibbon@ndcn.ox.ac.uk"}]
dependencies    = [
  "cachetools",
  "file_tree",
  "fslpy >=3.16.1",
  "jinja2",
  "joblib",
  "matplotlib",
  "nibabel",
  "numpy",
  "pandas",
  "scikit-learn >=1.3",
  "seaborn",
  "scipy",
  "spectrum",
]

[project.optional-dependencies]
extra = [
  "xgboost",
  "optuna"
]

[project.scripts]
fix = "pyfix.fix:main"

[project.urls]
"Repository" = "https://git.fmrib.ox.ac.uk/fsl/pyfix.git"

[tool.setuptools.packages.find]
include = ["pyfix*"]
exclude = ["examples"]

[tool.setuptools.package-data]
pyfix = ["VERSION", "resources/*", "resources/masks/*", "resources/models/*", "examples/*"]

[tool.setuptools.dynamic]
version = {file = "pyfix/VERSION"}


[tool.pytest.ini_options]
testpaths = ["pyfix/tests"]
addopts   = "-v --cov=pyfix --showlocals --import-mode=importlib --durations=0"
